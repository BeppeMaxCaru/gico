<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock EPS fundamentals</title>
    <link rel="stylesheet" href="../css/screener.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

    <main>
        <div class="search-container">
            <div class="search-box">
                <input id="ticker" type="text" placeholder="Enter stock ticker (e.g AAPL)">
                <button id="searchButton">Search</button>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-wrapper">
                <canvas id="epsChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="fcfChart"></canvas>
            </div>
        </div>

    </main>

    <script src="../js/screener.js"></script>
</body>
</html>
